name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentic_company
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic_dev_password
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic_company"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTIC_TEST_DATABASE_URL: postgresql://agentic:agentic_dev_password@127.0.0.1:54329/agentic_company
      AGENTIC_DATABASE_URL: postgresql://agentic:agentic_dev_password@127.0.0.1:54329/agentic_company
      AGENTIC_REDIS_URL: redis://127.0.0.1:63799/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev,app]"

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=agentic_company --cov-report=term-missing --cov-report=xml --cov-fail-under=75
