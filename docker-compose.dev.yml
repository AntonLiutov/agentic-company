services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_company
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_dev_password
    ports:
      - "54329:5432"
    volumes:
      - agentic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_company"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  agentic-postgres-data:
