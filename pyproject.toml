[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-company"
version = "0.1.0"
description = "Core orchestration and delivery primitives for an agentic IT company."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.1.9",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
app = [
    "alembic>=1.13.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "playwright>=1.48.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
[project.scripts]
agentic-run-codex = "agentic_company.agents.fullstack.codex_cli:main"
agentic-db-upgrade = "agentic_company.console.web.migrations:main"
agentic-web-console = "agentic_company.console.web.app:main"
agentic-qa-setup = "agentic_company.console.qa_setup:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_company.console.web" = [
    "templates/*.html",
    "static/*",
    "static/agents/*.png",
    "static/brand/*.png",
    "static/sponsors/*.ico",
    "static/sponsors/*.svg",
    "migrations/*.py",
    "migrations/versions/*.py",
]
"agentic_company.platform" = [
    "skill_catalog/*/SKILL.md",
    "skill_catalog/*/agents/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require external services such as PostgreSQL or Redis",
]

[tool.coverage.run]
source = ["agentic_company"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
