<section class="agent-grid">
  {% for agent in agents %}
    <article class="agent-card">
      <img class="agent-avatar" src="{{ agent.icon }}" alt="" loading="lazy">
      <h3>{{ agent.name }}</h3>
      <p>{{ agent.detail }}</p>
      <div class="chip-row">
        <span class="chip">{{ agent.provider }}</span>
        <span class="chip">{{ agent.model }}</span>
        {% if agent.reasoning != "none" %}
          <span class="chip">{{ agent.reasoning|title }}</span>
        {% endif %}
      </div>
    </article>
  {% endfor %}
</section>
